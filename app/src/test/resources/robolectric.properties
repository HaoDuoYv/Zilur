# Robolectric 全局配置。
#
# `sdk=34`：模块 `targetSdk = 35`，而 Robolectric 4.13 在**启用资源加载**
# （`testOptions.unitTests.isIncludeAndroidResources = true`，见 app/build.gradle.kts）
# 时最高只支持到 SDK 34。不钉住的话，所有 Robolectric 测试都会以
# `Package targetSdkVersion=35 > maxSdkVersion=34` 直接初始化失败。
#
# 这一项是"为了让公式渲染（jlatexmath 要从 assets 读字体与 TeXFormulaSettings.xml）
# 能在单测里跑起来"付的代价 —— 详见 HtmlExporterFormulaTest 的说明。
sdk=34
